services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fairwaypro
      POSTGRES_PASSWORD: fairwaypro
      POSTGRES_DB: fairwaypro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairwaypro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://fairwaypro:fairwaypro@db:5432/fairwaypro
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
    environment:
      API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_PRIMEASSIST_KEY: ${NEXT_PUBLIC_PRIMEASSIST_KEY}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
